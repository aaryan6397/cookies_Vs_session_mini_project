{% extends "base.html" %}

{% block title %}
Login
{% endblock %}


{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <div class="auth-icon">
            🔐
        </div>

        <h1>Welcome Back</h1>

        <p>
            Login to access your dashboard.
        </p>


        <form method="POST">

            <div class="form-group">

                <label>
                    Email Address
                </label>

                <input
                    type="email"
                    name="email"
                    placeholder="aaryan@gmail.com"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Vashu"
                    required
                >

            </div>


            <button
                type="submit"
                class="btn primary full">
                Login
            </button>

        </form>


        <div class="demo-login">

            <strong>Demo Credentials</strong>

            <p>
                Email: aaryan@gmail.com
            </p>

            <p>
                Password: Vashu
            </p>

        </div>

    </div>

</div>

{% endblock %}
